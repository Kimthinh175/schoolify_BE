<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schoolify - Interactive Draggable ERD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-grid: #131b2e;
      --panel-bg: rgba(15, 23, 42, 0.88);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Group Colors */
      --c-core: #3b82f6;
      --c-school: #10b981;
      --c-academic: #f59e0b;
      --c-saas: #ec4899;
      --c-store: #8b5cf6;
      --c-order: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      height: 60px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .title-group h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .title-group p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      width: 200px;
      transition: all 0.2s;
    }

    .search-box:focus {
      border-color: #6366f1;
      background: rgba(255, 255, 255, 0.1);
      width: 240px;
    }

    /* Canvas Viewport */
    #viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      cursor: grab;
    }

    #viewport.panning {
      cursor: grabbing;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      width: 10000px;
      height: 10000px;
    }

    /* SVG Connections Layer */
    #connections-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .wire {
      fill: none;
      stroke: rgba(148, 163, 184, 0.35);
      stroke-width: 1.8px;
      transition: stroke 0.2s, stroke-width 0.2s;
    }

    .wire.active {
      stroke: #60a5fa;
      stroke-width: 3.2px;
      filter: drop-shadow(0 0 6px rgba(96, 165, 250, 0.8));
    }

    /* Table Node Cards */
    .table-card {
      position: absolute;
      width: 270px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      z-index: 20;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s, border-color 0.2s, opacity 0.2s;
    }

    .table-card:hover {
      box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.8), 0 0 15px rgba(99, 102, 241, 0.25);
      border-color: rgba(148, 163, 184, 0.4);
      z-index: 30;
    }

    .table-card.dragging {
      opacity: 0.92;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
      cursor: grabbing !important;
      z-index: 50;
    }

    .table-card.highlighted {
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    .table-header {
      padding: 10px 14px;
      border-top-left-radius: 11px;
      border-top-right-radius: 11px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
    }

    .table-header:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .table-title {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .fields-list {
      padding: 8px 12px;
      max-height: 250px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fields-list::-webkit-scrollbar {
      width: 4px;
    }

    .fields-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .field-row:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .field-name {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #e2e8f0;
    }

    .tag-pk {
      background: #ef4444;
      color: white;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
    }

    .tag-fk {
      background: #3b82f6;
      color: white;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
    }

    .tag-uk {
      background: #10b981;
      color: white;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
    }

    .field-type {
      color: #64748b;
      font-size: 10.5px;
    }

    /* Floating Toolbar */
    .floating-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 90;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #38bdf8;
    }

    .v-divider {
      width: 1px;
      height: 20px;
      background: var(--border-color);
    }

    .zoom-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      min-width: 50px;
      text-align: center;
    }

    .tips-overlay {
      position: absolute;
      top: 76px;
      left: 20px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      color: var(--text-muted);
      pointer-events: none;
      z-index: 80;
    }
  </style>
</head>

      { id: 'Transaction', name: 'Transaction', group: 'order', x: 1150, y: 1300, fields: [
        { name: 'id', type: 'UUID', pk: true },
        { name: 'order_id', type: 'UUID', fk: true },
        { name: 'transaction_type', type: 'TransactionType' },
        { name: 'amount', type: 'Decimal' },
        { name: 'recipient_id', type: 'String' }
      ]}
    ];

    const RELATIONS = [
      { from: 'User', to: 'SchoolMember' },
      { from: 'School', to: 'SchoolMember' },
      { from: 'User', to: 'TeacherProfile' },
      { from: 'User', to: 'StudentProfile' },
      { from: 'User', to: 'ParentProfile' },
      { from: 'ParentProfile', to: 'ParentStudent' },
      { from: 'StudentProfile', to: 'ParentStudent' },
      { from: 'User', to: 'School' },
      { from: 'User', to: 'Notification' },
      { from: 'School', to: 'Department' },
      { from: 'Department', to: 'TeacherProfile' },
      { from: 'School', to: 'SchoolSubscription' },
      { from: 'SubscriptionPackage', to: 'SchoolSubscription' },
      { from: 'TeacherProfile', to: 'TeacherSubscription' },
      { from: 'SubscriptionPackage', to: 'TeacherSubscription' },
      { from: 'Category', to: 'Course' },
      { from: 'School', to: 'Course' },
      { from: 'Department', to: 'Course' },
      { from: 'TeacherProfile', to: 'Course' },
      { from: 'Course', to: 'Lesson' },
      { from: 'Lesson', to: 'LessonMaterial' },
      { from: 'School', to: 'Class' },
      { from: 'TeacherProfile', to: 'Class' },
      { from: 'Class', to: 'ClassEnrollment' },
      { from: 'StudentProfile', to: 'ClassEnrollment' },
      { from: 'Class', to: 'ClassSession' },
      { from: 'TeacherProfile', to: 'ClassSession' },
      { from: 'User', to: 'QuestionBank' },
      { from: 'School', to: 'QuestionBank' },
      { from: 'QuestionBank', to: 'Question' },
      { from: 'Question', to: 'Answer' },
      { from: 'StudentProfile', to: 'ExamSubmission' },
      { from: 'QuestionBank', to: 'ExamSubmission' },
      { from: 'ExamSubmission', to: 'SubmissionAnswer' },
      { from: 'Question', to: 'SubmissionAnswer' },
      { from: 'StudentProfile', to: 'StudentProgress' },
      { from: 'Course', to: 'StudentProgress' },
      { from: 'TeacherProfile', to: 'StoreItem' },
      { from: 'StoreItem', to: 'StudentInventory' },
      { from: 'StudentProfile', to: 'StudentInventory' },
      { from: 'User', to: 'Order' },
      { from: 'Order', to: 'Transaction' }
    ];

    // -------------------------------------------------------------
    // RENDER TABLES & WIRES
    // -------------------------------------------------------------
    const container = document.getElementById('tables-container');
    const svgLayer = document.getElementById('connections-layer');
    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('canvas');

    const groupColors = {
      core: 'var(--c-core)',
      school: 'var(--c-school)',
      academic: 'var(--c-academic)',
      saas: 'var(--c-saas)',
      store: 'var(--c-store)',
      order: 'var(--c-order)'
    };

    // Render HTML Cards
    TABLES.forEach(table => {
      const card = document.createElement('div');
      card.id = `card-${table.id}`;
      card.className = 'table-card';
      card.style.left = `${table.x}px`;
      card.style.top = `${table.y}px`;

      const color = groupColors[table.group] || '#94a3b8';

      let fieldsHtml = '';
      table.fields.forEach(f => {
        let tag = '';
        if (f.pk) tag = '<span class="tag-pk">PK</span>';
        else if (f.fk) tag = '<span class="tag-fk">FK</span>';
        else if (f.uk) tag = '<span class="tag-uk">UK</span>';

        fieldsHtml += `
          <div class="field-row">
            <div class="field-name">${tag} <span>${f.name}</span></div>
            <div class="field-type">${f.type}</div>
          </div>
        `;
      });

      card.innerHTML = `
        <div class="table-header" style="border-top: 3px solid ${color};">
          <div class="table-title">
            <span class="badge-dot" style="background: ${color};"></span>
            <span>${table.name}</span>
          </div>
          <span style="font-size: 11px; color: var(--text-muted);">::</span>
        </div>
        <div class="fields-list">
          ${fieldsHtml}
        </div>
      `;

      container.appendChild(card);
    });

    // Render SVG Paths
    function drawConnections() {
      // Clear existing paths (except defs)
      const paths = svgLayer.querySelectorAll('path.wire');
      paths.forEach(p => p.remove());

      RELATIONS.forEach((rel, index) => {
        const fromCard = document.getElementById(`card-${rel.from}`);
        const toCard = document.getElementById(`card-${rel.to}`);
        if (!fromCard || !toCard) return;

        const fromRect = {
          x: parseFloat(fromCard.style.left),
          y: parseFloat(fromCard.style.top),
          w: fromCard.offsetWidth,
          h: fromCard.offsetHeight
        };

        const toRect = {
          x: parseFloat(toCard.style.left),
          y: parseFloat(toCard.style.top),
          w: toCard.offsetWidth,
          h: toCard.offsetHeight
        };

        // Determine best connector sides (left or right)
        let startX, startY, endX, endY;

        if (fromRect.x + fromRect.w < toRect.x) {
          // From is strictly on the left of To
          startX = fromRect.x + fromRect.w;
          startY = fromRect.y + fromRect.h / 2;
          endX = toRect.x;
          endY = toRect.y + toRect.h / 2;
        } else if (toRect.x + toRect.w < fromRect.x) {
          // From is strictly on the right of To
          startX = fromRect.x;
          startY = fromRect.y + fromRect.h / 2;
          endX = toRect.x + toRect.w;
          endY = toRect.y + toRect.h / 2;
        } else {
          // Stacked vertically
          startX = fromRect.x + fromRect.w / 2;
          startY = fromRect.y > toRect.y ? fromRect.y : fromRect.y + fromRect.h;
          endX = toRect.x + toRect.w / 2;
          endY = fromRect.y > toRect.y ? toRect.y + toRect.h : toRect.y;
        }

        // Calculate smooth cubic bezier control points
        const dx = Math.abs(endX - startX) * 0.5;
        const dy = Math.abs(endY - startY) * 0.5;
        const cx1 = startX < endX ? startX + dx : startX - dx;
        const cy1 = startY;
        const cx2 = startX < endX ? endX - dx : endX + dx;
        const cy2 = endY;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${startX} ${startY} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${endX} ${endY}`);
        path.setAttribute('class', 'wire');
        path.setAttribute('id', `wire-${rel.from}-${rel.to}`);
        path.setAttribute('marker-end', 'url(#arrow)');

        svgLayer.appendChild(path);
      });
    }

    drawConnections();

    // -------------------------------------------------------------
    // DRAG TABLE CARDS (Tách bảng, tránh đè dây)
    // -------------------------------------------------------------
    let activeCard = null;
    let dragStartX = 0;
    let dragStartY = 0;
    let cardInitX = 0;
    let cardInitY = 0;

    document.querySelectorAll('.table-card').forEach(card => {
      const header = card.querySelector('.table-header');

      header.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        activeCard = card;
        card.classList.add('dragging');

        dragStartX = e.clientX;
        dragStartY = e.clientY;
        cardInitX = parseFloat(card.style.left) || 0;
        cardInitY = parseFloat(card.style.top) || 0;

        // Highlight connected wires
        highlightTable(card.id.replace('card-', ''));
      });
    });

    window.addEventListener('mousemove', (e) => {
      if (activeCard) {
        const dx = (e.clientX - dragStartX) / zoomScale;
        const dy = (e.clientY - dragStartY) / zoomScale;

        activeCard.style.left = `${cardInitX + dx}px`;
        activeCard.style.top = `${cardInitY + dy}px`;

        drawConnections();
      } else if (isPanning) {
        panX = e.clientX - panStartX;
        panY = e.clientY - panStartY;
        applyTransform();
      }
    });

    window.addEventListener('mouseup', () => {
      if (activeCard) {
        activeCard.classList.remove('dragging');
        activeCard = null;
      }
      if (isPanning) {
        isPanning = false;
        viewport.classList.remove('panning');
      }
    });

    // -------------------------------------------------------------
    // PAN & ZOOM CANVAS
    // -------------------------------------------------------------
    let zoomScale = 0.85;
    let panX = 120;
    let panY = 60;
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;

    function applyTransform() {
      canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
      document.getElementById('zoom-label').innerText = Math.round(zoomScale * 100) + '%';
    }

    applyTransform();

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.table-card')) return;
      isPanning = true;
      viewport.classList.add('panning');
      panStartX = e.clientX - panX;
      panStartY = e.clientY - panY;
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newScale = Math.min(Math.max(zoomScale * zoomFactor, 0.15), 3.0);

      // Zoom towards mouse pointer
      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      panX = mouseX - (mouseX - panX) * (newScale / zoomScale);
      panY = mouseY - (mouseY - panY) * (newScale / zoomScale);
      zoomScale = newScale;

      applyTransform();
    }, { passive: false });

    // Toolbar actions
    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      zoomScale = Math.min(zoomScale * 1.2, 3.0);
      applyTransform();
    });

    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      zoomScale = Math.max(zoomScale * 0.8, 0.15);
      applyTransform();
    });

    document.getElementById('btn-fit').addEventListener('click', () => {
      zoomScale = 0.55;
      panX = 60;
      panY = 40;
      applyTransform();
    });

    document.getElementById('btn-reset-pos').addEventListener('click', () => {
      TABLES.forEach(table => {
        const c = document.getElementById(`card-${table.id}`);
        if (c) {
          c.style.left = `${table.x}px`;
          c.style.top = `${table.y}px`;
        }
      });
      drawConnections();
      zoomScale = 0.85;
      panX = 120;
      panY = 60;
      applyTransform();
    });

    // -------------------------------------------------------------
    // SEARCH & HIGHLIGHT
    // -------------------------------------------------------------
    function highlightTable(tableId) {
      document.querySelectorAll('.table-card').forEach(c => c.classList.remove('highlighted'));
      document.querySelectorAll('.wire').forEach(w => w.classList.remove('active'));

      const targetCard = document.getElementById(`card-${tableId}`);
      if (targetCard) {
        targetCard.classList.add('highlighted');
      }

      // Highlight wires connected to this table
      RELATIONS.forEach(rel => {
        if (rel.from === tableId || rel.to === tableId) {
          const wire = document.getElementById(`wire-${rel.from}-${rel.to}`);
          if (wire) {
            wire.classList.add('active');
            wire.setAttribute('marker-end', 'url(#arrow-active)');
          }
        }
      });
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        document.querySelectorAll('.table-card').forEach(c => {
          c.style.opacity = '1';
          c.classList.remove('highlighted');
        });
        document.querySelectorAll('.wire').forEach(w => w.classList.remove('active'));
        return;
      }

      let firstMatch = null;

      TABLES.forEach(table => {
        const card = document.getElementById(`card-${table.id}`);
        const match = table.name.toLowerCase().includes(q) || table.fields.some(f => f.name.toLowerCase().includes(q));
        if (match) {
          card.style.opacity = '1';
          card.classList.add('highlighted');
          if (!firstMatch) firstMatch = table;
        } else {
          card.style.opacity = '0.2';
          card.classList.remove('highlighted');
        }
      });

      if (firstMatch) {
        highlightTable(firstMatch.id);
      }
    });
  </script>
</body>
</html>
