name: Zalo Git Push Alert

on:
  push:
    branches:
      - '**'

jobs:
  notify-zalo:
    runs-on: ubuntu-latest
    steps:
      - name: Gửi tin nhắn riêng vào Zalo của Thịnh
        run: |
          PUSHER="${{ github.actor }}"
          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          
          TEXT="🚀 [GIT PUSH ALERT]\n\n👤 Người push: $PUSHER\n📂 Dự án: $REPO\n🌿 Nhánh: $BRANCH\n📝 Commit: $COMMIT_MSG\n🔗 Xem code: $COMMIT_URL"
          
          curl -s -X POST "https://bot-api.zaloplatforms.com/bot${{ secrets.ZALO_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{
              "chat_id": "${{ secrets.ZALO_CHAT_ID }}",
              "text": "'"$TEXT"'"
            }'
